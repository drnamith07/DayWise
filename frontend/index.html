<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayWise | Student Life Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">YOUR STUDENT LIFE COMPANION</p>
      <h1>DayWise <span>✦</span></h1>
      <p class="intro">A simpler way to organise your studies and daily wellbeing.</p>
    </header>

    <section class="summary-grid" aria-label="Daily summary">
      <article class="summary-card"><span>Tasks completed</span><strong id="completed">0</strong></article>
      <article class="summary-card"><span>Tasks pending</span><strong id="pending">0</strong></article>
      <article class="summary-card"><span>Water glasses</span><strong id="water-total">0</strong></article>
      <article class="summary-card"><span>Exercise minutes</span><strong id="exercise-total">0</strong></article>
    </section>

    <section class="panel">
      <h2>Academic tasks</h2>
      <form id="task-form" class="task-form">
        <input id="task-title" type="text" placeholder="Add an assignment or task" required>
        <input id="task-date" type="date" aria-label="Due date">
        <button type="submit">Add task</button>
      </form>
      <ul id="task-list" class="task-list"></ul>
    </section>

    <section class="panel">
      <h2>Daily wellbeing</h2>
      <form id="wellness-form" class="wellness-form">
        <label>Water glasses
          <input id="water" type="number" min="0" max="30" value="0">
        </label>
        <label>Exercise minutes
          <input id="exercise" type="number" min="0" max="600" value="0">
        </label>
        <button type="submit">Save today's record</button>
      </form>
    </section>
    <p id="message" role="status"></p>
    <footer>DayWise · Make MCP Matter</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
